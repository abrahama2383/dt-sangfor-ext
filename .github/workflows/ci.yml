# Runs the whole test suite on Python 3.10 and 3.14 (the two ActiveGate runtimes) for every push and pull request to
# main, then a real `dt-sdk run` against the simulator. The tests start a mock Sangfor API on 127.0.0.1 and snmpsim
# agents on UDP 11161-11163, so they need no network access and no real HCI.
# Actions are pinned by commit SHA (the comment names the release).
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # report both runtimes, not just the first failure
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test suite (warnings are errors)
        run: python -m pytest -W error
      - name: Smoke run (real dt-sdk run against the simulator)
        if: matrix.python == '3.14'
        run: python scripts/smoke_run.py
