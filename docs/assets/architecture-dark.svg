<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="How the extension works: the Sangfor REST API and SNMP agents are polled from an Environment ActiveGate, mapped to metrics, entities and events, and sent to Dynatrace Managed">
<style>
  .hd{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;fill:#4cc3d9}
  .bt{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;fill:#eef3f7} .bs{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#7c8c9b}
  .ft{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#aab8c5}
  .flow{fill:none;stroke:#5d6f80;stroke-width:1.5;stroke-dasharray:5 7;opacity:.75;animation:flow 1.1s linear infinite}
  .box{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="1199" height="469" rx="18" fill="#0a131c" stroke="#22384b"/>
<text x="36" y="48" class="hd">SANGFOR HCI</text><text x="326" y="48" class="hd">COLLECT</text><text x="616" y="48" class="hd">MAP</text><text x="906" y="48" class="hd">DYNATRACE MANAGED</text>
<rect x="312" y="60" width="576" height="258" rx="16" fill="none" stroke="#4cc3d9" stroke-dasharray="4 6" opacity=".55"/><text x="326" y="338" class="ft">Environment ActiveGate · Extension Execution Controller · Python 3.10 or 3.14</text>
<path class="flow" d="M294,104.0 C310.0,104.0 310.0,104.0 326,104.0" style="animation-delay:0.00s"/><path class="flow" d="M294,188.0 C310.0,188.0 310.0,188.0 326,188.0" style="animation-delay:-0.17s"/><path class="flow" d="M294,272.0 C310.0,272.0 310.0,188.0 326,188.0" style="animation-delay:-0.34s"/><path class="flow" d="M584,104.0 C600.0,104.0 600.0,104.0 616,104.0" style="animation-delay:-0.51s"/><path class="flow" d="M584,104.0 C600.0,104.0 600.0,188.0 616,188.0" style="animation-delay:-0.68s"/><path class="flow" d="M584,188.0 C600.0,188.0 600.0,104.0 616,104.0" style="animation-delay:-0.85s"/><path class="flow" d="M584,272.0 C600.0,272.0 600.0,272.0 616,272.0" style="animation-delay:-1.02s"/><path class="flow" d="M874,104.0 C890.0,104.0 890.0,104.0 906,104.0" style="animation-delay:-1.19s"/><path class="flow" d="M874,104.0 C890.0,104.0 890.0,188.0 906,188.0" style="animation-delay:-1.36s"/><path class="flow" d="M874,188.0 C890.0,188.0 890.0,272.0 906,272.0" style="animation-delay:-1.53s"/><path class="flow" d="M874,272.0 C890.0,272.0 890.0,104.0 906,104.0" style="animation-delay:-1.70s"/><path class="flow" d="M874,104.0 C890.0,104.0 890.0,356.0 906,356.0" style="animation-delay:-1.87s"/><path class="flow" d="M455.0,136 L455.0,156" style="animation-delay:-.3s"/><path class="flow" d="M455.0,220 L455.0,240" style="animation-delay:-.6s"/>
<g class="box" style="animation-delay:0.00s"><rect x="36" y="72" width="258" height="64" rx="12" fill="#122130" stroke="#22384b"/><rect x="36" y="86" width="4" height="36" rx="2" fill="#3987e5"/><text x="54" y="99" class="bt">REST API · cluster VIP</text><text x="54" y="119" class="bs">HTTPS 443 · GET only</text></g><g class="box" style="animation-delay:0.08s"><rect x="36" y="156" width="258" height="64" rx="12" fill="#122130" stroke="#22384b"/><rect x="36" y="170" width="4" height="36" rx="2" fill="#d95926"/><text x="54" y="183" class="bt">SNMP agent · every node</text><text x="54" y="203" class="bs">UDP 161 · v2c or v3</text></g><g class="box" style="animation-delay:0.16s"><rect x="36" y="240" width="258" height="64" rx="12" fill="#122130" stroke="#22384b"/><rect x="36" y="254" width="4" height="36" rx="2" fill="#c98500"/><text x="54" y="267" class="bt">Sangfor private MIB</text><text x="54" y="287" class="bs">35047 · fans, RAID, SSD, temps</text></g><g class="box" style="animation-delay:0.32s"><rect x="326" y="72" width="258" height="64" rx="12" fill="#122130" stroke="#22384b"/><rect x="326" y="86" width="4" height="36" rx="2" fill="#3987e5"/><text x="344" y="99" class="bt">API client</text><text x="344" y="119" class="bs">GET allowlist · login back-off</text></g><g class="box" style="animation-delay:0.40s"><rect x="326" y="156" width="258" height="64" rx="12" fill="#122130" stroke="#22384b"/><rect x="326" y="170" width="4" height="36" rx="2" fill="#d95926"/><text x="344" y="183" class="bt">SNMP client</text><text x="344" y="203" class="bs">GET / WALK only · per node</text></g><g class="box" style="animation-delay:0.48s"><rect x="326" y="240" width="258" height="64" rx="12" fill="#122130" stroke="#22384b"/><rect x="326" y="254" width="4" height="36" rx="2" fill="#4cc3d9"/><text x="344" y="267" class="bt">Cluster runner</text><text x="344" y="287" class="bs">60 s cycle · VMs every 300 s</text></g><g class="box" style="animation-delay:0.64s"><rect x="616" y="72" width="258" height="64" rx="12" fill="#122130" stroke="#22384b"/><rect x="616" y="86" width="4" height="36" rx="2" fill="#9085e9"/><text x="634" y="99" class="bt">Collectors</text><text x="634" y="119" class="bs">5 feature sets · 44 metrics</text></g><g class="box" style="animation-delay:0.72s"><rect x="616" y="156" width="258" height="64" rx="12" fill="#122130" stroke="#22384b"/><rect x="616" y="170" width="4" height="36" rx="2" fill="#d55181"/><text x="634" y="183" class="bt">Alarm cursor</text><text x="634" y="203" class="bs">new alarms → Dynatrace events</text></g><g class="box" style="animation-delay:0.80s"><rect x="616" y="240" width="258" height="64" rx="12" fill="#122130" stroke="#22384b"/><rect x="616" y="254" width="4" height="36" rx="2" fill="#2bbf5f"/><text x="634" y="267" class="bt">Self-monitoring</text><text x="634" y="287" class="bs">ext.poll.duration / .errors</text></g><g class="box" style="animation-delay:0.96s"><rect x="906" y="72" width="258" height="64" rx="12" fill="#122130" stroke="#22384b"/><rect x="906" y="86" width="4" height="36" rx="2" fill="#4cc3d9"/><text x="924" y="99" class="bt">Metrics</text><text x="924" y="119" class="bs">46 keys · sangfor.hci.*</text></g><g class="box" style="animation-delay:1.04s"><rect x="906" y="156" width="258" height="64" rx="12" fill="#122130" stroke="#22384b"/><rect x="906" y="170" width="4" height="36" rx="2" fill="#9085e9"/><text x="924" y="183" class="bt">Topology</text><text x="924" y="203" class="bs">vm → host → cluster</text></g><g class="box" style="animation-delay:1.12s"><rect x="906" y="240" width="258" height="64" rx="12" fill="#122130" stroke="#22384b"/><rect x="906" y="254" width="4" height="36" rx="2" fill="#d55181"/><text x="924" y="267" class="bt">Events</text><text x="924" y="287" class="bs">on the cluster, host or VM</text></g><g class="box" style="animation-delay:1.20s"><rect x="906" y="324" width="258" height="64" rx="12" fill="#122130" stroke="#22384b"/><rect x="906" y="338" width="4" height="36" rx="2" fill="#2bbf5f"/><text x="924" y="351" class="bt">Screens &amp; dashboard</text><text x="924" y="371" class="bs">4 screens · overview dashboard</text></g>
<text x="36" y="440" class="ft">Read-only toward Sangfor: GET requests plus one login POST, never resent. Secrets stay in the Dynatrace credential store and never reach logs, events or dimensions.</text>
</svg>
